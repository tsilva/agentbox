name: Release verified images
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v1.0.0)
        required: true
      claude_version:
        description: Explicit Claude Code version
        required: true
      codex_tag:
        description: Explicit Codex release tag
        required: true
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify launcher, broker, and isolation before publication
        env:
          CLAUDE_VERSION: ${{ inputs.claude_version }}
          CODEX_TAG: ${{ inputs.codex_tag }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck jq
          ./scripts/lint.sh
          python3 tests/launcher-test.py
          ./tests/validation-test.sh
          ./tests/version-check-test.sh
          docker build --build-arg "CLAUDE_CODE_VERSION=$CLAUDE_VERSION" --build-arg "CODEX_RELEASE_TAG=$CODEX_TAG" -t agentbox .
          docker build --target broker -t agentbox-broker .
          ./tests/security-regression.sh
          ./tests/isolation-test.sh
          ./tests/launcher-docker-test.sh
          docker run --rm -i --network none --entrypoint python3 agentbox - < tests/provider-protocol-test.py
  build:
    needs: verify
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: true
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        variant: [claude, codex, claude-python, codex-python, broker]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build, test, and publish native image
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CLAUDE_VERSION: ${{ inputs.claude_version }}
          CODEX_TAG: ${{ inputs.codex_tag }}
          VARIANT: ${{ matrix.variant }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$CLAUDE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$CODEX_TAG" =~ ^rust-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          target="${VARIANT%-python}"
          python=0
          [[ "$VARIANT" != *-python ]] || python=1
          arch=$(uname -m)
          case "$arch" in x86_64) arch=amd64 ;; aarch64) arch=arm64 ;; *) exit 1 ;; esac
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/agentbox-$VARIANT:$RELEASE_TAG-$arch"
          docker build --target "$target" --build-arg "PYTHON_TOOLS=$python" \
            --build-arg "CLAUDE_CODE_VERSION=$CLAUDE_VERSION" \
            --build-arg "CODEX_RELEASE_TAG=$CODEX_TAG" -t "$image" .
          if [ "$target" != broker ]; then
            docker run --rm --entrypoint "$target" "$image" --version
          fi
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - name: Sign multi-platform digests and create release index
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '{"schemaVersion":1,"images":{}}\n' > images.json
          for variant in claude codex claude-python codex-python broker; do
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/agentbox-$variant"
            docker buildx imagetools create -t "$image:$RELEASE_TAG" "$image:$RELEASE_TAG-amd64" "$image:$RELEASE_TAG-arm64"
            digest=$(docker buildx imagetools inspect "$image:$RELEASE_TAG" --format '{{.Manifest.Digest}}')
            reference="$image@$digest"
            cosign sign --yes "$reference"
            jq --arg variant "$variant" --arg ref "$reference" '.images[$variant] = {reference:$ref}' images.json > images.next.json
            mv images.next.json images.json
          done
          # Release versions are immutable; reruns cannot overwrite a published index.
          gh release create "$RELEASE_TAG" images.json --target "$GITHUB_SHA" --title "agentbox $RELEASE_TAG" --notes "Signed Claude/Codex images for Linux ARM64 and x86-64; Python tooling is optional."
